<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title id="pageTitle">ALUTECH Products Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Local PDF.js Engine -->
  <script src="pdfjs/pdf.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Sticky Header */
    .viewer-navbar {
      height: 56px;
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.75rem;
      gap: 0.5rem;
      flex-shrink: 0;
      z-index: 100;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    }

    /* Back Button */
    .btn-nav-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #1e293b;
      color: #ffffff;
      text-decoration: none;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.14);
      flex-shrink: 0;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .btn-nav-back:active, .btn-nav-back:hover {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      transform: scale(0.97);
    }

    /* Center Title and Status */
    .viewer-title-wrap {
      flex: 1;
      min-width: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 0.25rem;
    }

    .viewer-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .viewer-status {
      font-size: 0.68rem;
      color: #38bdf8;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    /* Right Action Group */
    .viewer-nav-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    /* Raw Full View Button */
    .btn-nav-full {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      text-decoration: none;
      padding: 0.45rem 0.65rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.35);
      transition: all 0.15s ease;
    }

    .btn-nav-full:active, .btn-nav-full:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    /* Download Button */
    .btn-nav-dl {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      transition: all 0.15s ease;
    }

    .btn-nav-dl:active, .btn-nav-dl:hover {
      background: #0369a1;
      transform: scale(0.97);
    }

    /* PDF Viewport - BLOCK FLOW to prevent flexbox crushing */
    .viewer-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 0.75rem 0.5rem 3rem 0.5rem;
      display: block;
    }

    /* Individual Page Card Container */
    .pdf-page-card {
      display: block;
      width: 100%;
      max-width: 860px;
      margin: 0 auto 16px auto;
      background: #1e293b;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }

    /* HTML5 Canvas / Image preview for each page */
    .pdf-canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      object-fit: contain;
    }

    /* Page Skeleton Placeholder */
    .page-skeleton {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      color: #64748b;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Page Number Badge */
    .page-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      color: #f1f5f9;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    /* Bottom Quick Action Bar */
    .bottom-bar {
      padding: 1.5rem 0.5rem 2rem 0.5rem;
      text-align: center;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    .bottom-bar-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 0.65rem 1.2rem;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .bottom-bar-link:active {
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Sticky Top Header -->
  <header class="viewer-navbar">
    <button type="button" onclick="goBack()" class="btn-nav-back" aria-label="Go back to ALUTECH">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Back</span>
    </button>

    <div class="viewer-title-wrap">
      <h1 class="viewer-title" id="catalogueTitle">ALUTECH Product</h1>
      <span class="viewer-status" id="viewerStatus">
        <span class="status-dot"></span>
        <span id="statusText">Opening...</span>
      </span>
    </div>

    <div class="viewer-nav-actions">
      <a href="#" id="rawFullBtn" class="btn-nav-full" title="Open in raw browser view">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        <span>Full View</span>
      </a>

      <a href="#" id="downloadBtn" download class="btn-nav-dl" title="Download this PDF Product">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>PDF</span>
      </a>
    </div>
  </header>

  <!-- Vertical Scroll Container -->
  <main class="viewer-viewport" id="pagesContainer">
    <!-- Initial instant cover page preview if provided -->
    <div class="pdf-page-card" id="page-card-1" style="display: none;">
      <img id="instantCoverImg" class="pdf-canvas" alt="Catalogue Cover" src="" style="display: none;">
      <div class="page-badge" id="coverBadge">Page 1</div>
    </div>
  </main>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const fileParam = urlParams.get('file');
    const titleParam = urlParams.get('title') || 'ALUTECH Catalogue';
    const thumbParam = urlParams.get('thumb');

    const catalogueTitle = document.getElementById('catalogueTitle');
    const pageTitle = document.getElementById('pageTitle');
    const viewerStatus = document.getElementById('viewerStatus');
    const statusText = document.getElementById('statusText');
    const downloadBtn = document.getElementById('downloadBtn');
    const rawFullBtn = document.getElementById('rawFullBtn');
    const pagesContainer = document.getElementById('pagesContainer');
    const pageCard1 = document.getElementById('page-card-1');
    const instantCoverImg = document.getElementById('instantCoverImg');

    if (titleParam) {
      catalogueTitle.textContent = titleParam;
      pageTitle.textContent = titleParam + ' - ALUTECH';
    }

    // Instant Zero-Second Cover Rendering: Display cached thumbnail immediately
    if (thumbParam) {
      instantCoverImg.src = decodeURIComponent(thumbParam);
      instantCoverImg.style.display = 'block';
      pageCard1.style.display = 'block';
      statusText.textContent = 'Rendering pages...';
    }

    if (fileParam) {
      const cleanUrl = encodeURI(fileParam);
      downloadBtn.href = cleanUrl;
      downloadBtn.setAttribute('download', fileParam.split('/').pop());
      rawFullBtn.href = cleanUrl;
      renderCatalogue(cleanUrl);
    } else {
      statusText.textContent = 'File missing';
    }

    function goBack() {
      if (document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
      } else {
        window.location.href = 'index.html#products';
      }
    }

    async function renderCatalogue(pdfUrl) {
      try {
        // High-performance stream loading
        const loadingTask = pdfjsLib.getDocument({
          url: pdfUrl,
          rangeChunkSize: 65536 * 4
        });

        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;

        statusText.textContent = totalPages + ' Pages';
        const dot = viewerStatus.querySelector('.status-dot');
        if (dot) dot.style.display = 'none';

        // Load Page 1 dimensions
        const firstPage = await pdf.getPage(1);
        const unscaledViewport = firstPage.getViewport({ scale: 1 });
        const aspectRatio = unscaledViewport.height / unscaledViewport.width;

        const targetWidth = Math.min(window.innerWidth - 16, 860);
        const estimatedCardHeight = Math.round(targetWidth * aspectRatio);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        // Pre-create placeholder cards with exact dimensions
        pageCard1.style.display = 'block';
        pageCard1.dataset.pageNum = '1';
        pageCard1.dataset.rendered = 'false';

        const pageCards = [pageCard1];

        for (let i = 2; i <= totalPages; i++) {
          const card = document.createElement('div');
          card.className = 'pdf-page-card';
          card.id = 'page-card-' + i;
          card.dataset.pageNum = String(i);
          card.dataset.rendered = 'false';
          card.style.height = estimatedCardHeight + 'px';

          const skeleton = document.createElement('div');
          skeleton.className = 'page-skeleton';
          skeleton.textContent = 'Page ' + i + ' of ' + totalPages;
          card.appendChild(skeleton);

          pagesContainer.appendChild(card);
          pageCards.push(card);
        }

        // Bottom link for direct native view
        const bottomBar = document.createElement('div');
        bottomBar.className = 'bottom-bar';
        bottomBar.innerHTML = '<a href="' + pdfUrl + '" class="bottom-bar-link"><svg width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" viewBox=\"0 0 24 24\"><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"></path><polyline points=\"15 3 21 3 21 9\"></polyline><line x1=\"10\" y1=\"14\" x2=\"21\" y2=\"3\"></line></svg> Prefer native full view? Tap to open raw</a>';
        pagesContainer.appendChild(bottomBar);

        // Sequential rendering queue
        let renderQueue = Promise.resolve();

        function queueRenderPage(pageNum) {
          const card = document.getElementById('page-card-' + pageNum);
          if (!card || card.dataset.rendered !== 'false') return;
          card.dataset.rendered = 'pending';

          renderQueue = renderQueue.then(async () => {
            try {
              const page = (pageNum === 1) ? firstPage : await pdf.getPage(pageNum);
              const pViewport = page.getViewport({ scale: 1 });

              const fitScale = targetWidth / pViewport.width;
              const scaledViewport = page.getViewport({ scale: fitScale * dpr });

              const canvas = document.createElement('canvas');
              canvas.className = 'pdf-canvas';
              canvas.width = scaledViewport.width;
              canvas.height = scaledViewport.height;

              const ctx = canvas.getContext('2d');
              await page.render({
                canvasContext: ctx,
                viewport: scaledViewport
              }).promise;

              // Insert canvas into card
              card.innerHTML = '';
              card.appendChild(canvas);
              card.style.height = 'auto';
              card.dataset.rendered = 'done';

              // Add page badge
              const badge = document.createElement('div');
              badge.className = 'page-badge';
              badge.textContent = pageNum + ' / ' + totalPages;
              card.appendChild(badge);
            } catch (renderErr) {
              console.error('Error rendering page ' + pageNum, renderErr);
              card.dataset.rendered = 'error';
            }
          });
        }

        // Render Page 1 and Page 2 right away
        queueRenderPage(1);
        if (totalPages >= 2) {
          queueRenderPage(2);
        }

        // Lazy-render remaining pages as user scrolls
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const pNum = parseInt(entry.target.dataset.pageNum, 10);
              queueRenderPage(pNum);
            }
          });
        }, {
          root: pagesContainer,
          rootMargin: '400px'
        });

        pageCards.forEach(card => observer.observe(card));

      } catch (err) {
        console.error('Failed to load PDF document', err);
        statusText.textContent = 'Viewer error';
      }
    }
  </script>
</body>
</html>
