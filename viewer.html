<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title id="pageTitle">ALUTECH Catalogue Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      display: flex;
      flex-direction: column;
    }

    /* Top Sticky Navigation Bar */
    .viewer-navbar {
      height: 58px;
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      gap: 0.75rem;
      flex-shrink: 0;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    /* Back Button */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: #1e293b;
      color: #ffffff;
      text-decoration: none;
      padding: 0.5rem 0.85rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .btn-back:active, .btn-back:hover {
      background: #334155;
      color: #38bdf8;
      border-color: #38bdf8;
      transform: scale(0.98);
    }

    /* Title */
    .viewer-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      flex: 1;
      padding: 0 0.25rem;
    }

    /* Download Action Button */
    .btn-dl {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 0.5rem 0.85rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .btn-dl:active, .btn-dl:hover {
      background: #0369a1;
      transform: scale(0.98);
    }

    /* PDF Container */
    .viewer-content {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #1e293b;
    }

    .pdf-embed {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Fallback Bar for mobile browsers */
    .viewer-footer-hint {
      background: #090d16;
      color: #94a3b8;
      font-size: 0.72rem;
      text-align: center;
      padding: 0.4rem 0.75rem;
      flex-shrink: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .viewer-footer-hint a {
      color: #38bdf8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Top Bar with Back Button -->
  <header class="viewer-navbar">
    <a href="javascript:void(0)" onclick="goBack()" class="btn-back" title="Go back to ALUTECH">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Back</span>
    </a>

    <h1 class="viewer-title" id="catalogueTitle">ALUTECH Catalogue</h1>

    <a href="#" id="downloadBtn" download class="btn-dl" title="Download this Catalogue">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span>PDF</span>
    </a>
  </header>

  <!-- PDF Display Area -->
  <main class="viewer-content">
    <iframe id="pdfFrame" class="pdf-embed" src="" title="Catalogue Viewer"></iframe>
  </main>

  <footer class="viewer-footer-hint">
    Use pinch gestures to zoom. Having trouble? <a href="#" id="directPdfLink" target="_blank">Tap here for raw full view</a>.
  </footer>

  <script>
    // Parse URL query params: ?file=...&title=...
    const urlParams = new URLSearchParams(window.location.search);
    const fileParam = urlParams.get('file');
    const titleParam = urlParams.get('title') || 'ALUTECH Catalogue';

    const catalogueTitle = document.getElementById('catalogueTitle');
    const pageTitle = document.getElementById('pageTitle');
    const downloadBtn = document.getElementById('downloadBtn');
    const pdfFrame = document.getElementById('pdfFrame');
    const directPdfLink = document.getElementById('directPdfLink');

    if (titleParam) {
      catalogueTitle.textContent = titleParam;
      pageTitle.textContent = titleParam + ' - ALUTECH';
    }

    if (fileParam) {
      const cleanUrl = encodeURI(fileParam);
      pdfFrame.src = cleanUrl + '#toolbar=1&navpanes=0';
      downloadBtn.href = cleanUrl;
      downloadBtn.setAttribute('download', fileParam.split('/').pop());
      directPdfLink.href = cleanUrl;
    }

    function goBack() {
      if (document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
      } else {
        window.location.href = 'index.html#products';
      }
    }
  </script>
</body>
</html>
