<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title id="pageTitle">ALUTECH Catalogue Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- Local PDF.js -->
  <script src="pdfjs/pdf.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Sticky Header */
    .viewer-navbar {
      height: 56px;
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 0.75rem;
      gap: 0.5rem;
      flex-shrink: 0;
      z-index: 100;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    }

    /* Back Button */
    .btn-nav-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #1e293b;
      color: #ffffff;
      text-decoration: none;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.14);
      flex-shrink: 0;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .btn-nav-back:active, .btn-nav-back:hover {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      transform: scale(0.97);
    }

    /* Center Title and Page Count */
    .viewer-title-wrap {
      flex: 1;
      min-width: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 0.25rem;
    }

    .viewer-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .viewer-page-count {
      font-size: 0.68rem;
      color: #94a3b8;
      font-weight: 600;
    }

    /* Right Action Group */
    .viewer-nav-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    /* Raw Full View Button */
    .btn-nav-full {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      text-decoration: none;
      padding: 0.45rem 0.65rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.35);
      transition: all 0.15s ease;
    }

    .btn-nav-full:active, .btn-nav-full:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    /* Download Button */
    .btn-nav-dl {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      transition: all 0.15s ease;
    }

    .btn-nav-dl:active, .btn-nav-dl:hover {
      background: #0369a1;
      transform: scale(0.97);
    }

    /* PDF Viewport - BLOCK FLOW to prevent flexbox crushing */
    .viewer-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 0.75rem 0.5rem 3rem 0.5rem;
      display: block; /* Standard block layout: items stack naturally and never shrink */
    }

    /* Loading Spinner Overlay */
    .viewer-loading {
      position: absolute;
      inset: 56px 0 0 0;
      background: #090d16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 50;
      transition: opacity 0.3s ease;
    }

    .loading-spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .loading-text {
      font-size: 0.88rem;
      color: #94a3b8;
      font-weight: 600;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Individual Page Card Container */
    .pdf-page-card {
      display: block;
      width: 100%;
      max-width: 860px;
      margin: 0 auto 16px auto;
      background: #1e293b;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }

    /* HTML5 Canvas for Each Page */
    .pdf-canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }

    /* Page Skeleton Placeholder with natural height */
    .page-skeleton {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      color: #64748b;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Page Number Badge */
    .page-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      color: #f1f5f9;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }

    /* Bottom Quick Action Bar */
    .bottom-bar {
      padding: 1.5rem 0.5rem 2rem 0.5rem;
      text-align: center;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    .bottom-bar-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 0.65rem 1.2rem;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .bottom-bar-link:active {
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Sticky Top Header -->
  <header class="viewer-navbar">
    <button type="button" onclick="goBack()" class="btn-nav-back" aria-label="Go back to ALUTECH">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      <span>Back</span>
    </button>

    <div class="viewer-title-wrap">
      <h1 class="viewer-title" id="catalogueTitle">ALUTECH Catalogue</h1>
      <span class="viewer-page-count" id="pageCountLabel">Loading...</span>
    </div>

    <div class="viewer-nav-actions">
      <a href="#" id="rawFullBtn" class="btn-nav-full" title="Open in raw browser view">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        <span>Full View</span>
      </a>

      <a href="#" id="downloadBtn" download class="btn-nav-dl" title="Download this PDF Catalogue">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>PDF</span>
      </a>
    </div>
  </header>

  <!-- Loading State Overlay -->
  <div class="viewer-loading" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Opening Catalogue...</div>
  </div>

  <!-- Vertical Scroll Container (Block Flow) -->
  <main class="viewer-viewport" id="pagesContainer">
    <!-- Dynamic Page Cards appended here -->
  </main>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const fileParam = urlParams.get('file');
    const titleParam = urlParams.get('title') || 'ALUTECH Catalogue';

    const catalogueTitle = document.getElementById('catalogueTitle');
    const pageTitle = document.getElementById('pageTitle');
    const pageCountLabel = document.getElementById('pageCountLabel');
    const downloadBtn = document.getElementById('downloadBtn');
    const rawFullBtn = document.getElementById('rawFullBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const pagesContainer = document.getElementById('pagesContainer');

    if (titleParam) {
      catalogueTitle.textContent = titleParam;
      pageTitle.textContent = titleParam + ' - ALUTECH';
    }

    if (fileParam) {
      const cleanUrl = encodeURI(fileParam);
      downloadBtn.href = cleanUrl;
      downloadBtn.setAttribute('download', fileParam.split('/').pop());
      rawFullBtn.href = cleanUrl;
      renderCatalogue(cleanUrl);
    } else {
      loadingOverlay.innerHTML = '<div style="color:#ef4444;font-weight:700;">No catalogue file specified.</div>';
    }

    function goBack() {
      if (document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
      } else {
        window.location.href = 'index.html#products';
      }
    }

    async function renderCatalogue(pdfUrl) {
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;

        pageCountLabel.textContent = totalPages + ' Pages';

        // Load Page 1 first to determine aspect ratio & viewport width
        const firstPage = await pdf.getPage(1);
        const unscaledViewport = firstPage.getViewport({ scale: 1 });
        const aspectRatio = unscaledViewport.height / unscaledViewport.width;

        const targetWidth = Math.min(window.innerWidth - 16, 860);
        const estimatedCardHeight = Math.round(targetWidth * aspectRatio);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        // Create placeholder cards with EXACT estimated height so they establish true scroll height
        const pageCards = [];
        for (let i = 1; i <= totalPages; i++) {
          const card = document.createElement('div');
          card.className = 'pdf-page-card';
          card.id = 'page-card-' + i;
          card.dataset.pageNum = i;
          card.dataset.rendered = 'false';
          card.style.height = estimatedCardHeight + 'px';

          const skeleton = document.createElement('div');
          skeleton.className = 'page-skeleton';
          skeleton.textContent = 'Page ' + i + ' of ' + totalPages;
          card.appendChild(skeleton);

          pagesContainer.appendChild(card);
          pageCards.push(card);
        }

        // Bottom link for direct native view
        const bottomBar = document.createElement('div');
        bottomBar.className = 'bottom-bar';
        bottomBar.innerHTML = '<a href="' + pdfUrl + '" class="bottom-bar-link"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg> Prefer native full view? Tap to open raw</a>';
        pagesContainer.appendChild(bottomBar);

        // Sequential rendering queue to avoid parallel WebKit canvas resource spikes
        let renderQueue = Promise.resolve();

        function queueRenderPage(pageNum) {
          const card = document.getElementById('page-card-' + pageNum);
          if (!card || card.dataset.rendered !== 'false') return;
          card.dataset.rendered = 'pending';

          renderQueue = renderQueue.then(async () => {
            try {
              const page = (pageNum === 1) ? firstPage : await pdf.getPage(pageNum);
              const pViewport = page.getViewport({ scale: 1 });

              // Dynamic scale calculation for exact fit-to-width
              const fitScale = targetWidth / pViewport.width;
              const scaledViewport = page.getViewport({ scale: fitScale * dpr });

              const canvas = document.createElement('canvas');
              canvas.className = 'pdf-canvas';
              canvas.width = scaledViewport.width;
              canvas.height = scaledViewport.height;

              const ctx = canvas.getContext('2d');
              await page.render({
                canvasContext: ctx,
                viewport: scaledViewport
              }).promise;

              // Insert canvas into card and clear fixed height
              card.innerHTML = '';
              card.appendChild(canvas);
              card.style.height = 'auto'; // Release fixed height to let canvas fit perfectly
              card.dataset.rendered = 'done';

              // Add page badge
              const badge = document.createElement('div');
              badge.className = 'page-badge';
              badge.textContent = pageNum + ' / ' + totalPages;
              card.appendChild(badge);

              if (pageNum === 1 && loadingOverlay) {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => { loadingOverlay.style.display = 'none'; }, 250);
              }
            } catch (renderErr) {
              console.error('Error rendering page ' + pageNum, renderErr);
              card.dataset.rendered = 'error';
            }
          });
        }

        // Render Page 1 immediately
        queueRenderPage(1);
        if (totalPages >= 2) {
          queueRenderPage(2);
        }

        // Lazy-render remaining pages as user scrolls toward them
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const pNum = parseInt(entry.target.dataset.pageNum, 10);
              queueRenderPage(pNum);
            }
          });
        }, {
          root: pagesContainer,
          rootMargin: '400px'
        });

        pageCards.forEach(card => observer.observe(card));

      } catch (err) {
        console.error('Failed to load PDF document', err);
        loadingOverlay.innerHTML = '<div style="text-align:center;padding:1.5rem;"><p style="color:#f87171;font-weight:700;margin-bottom:0.75rem;">Could not load in-page viewer.</p><a href="' + pdfUrl + '" class="btn-nav-full" style="font-size:0.9rem;padding:0.6rem 1.2rem;">Tap to open in Raw Full View</a></div>';
      }
    }
  </script>
</body>
</html>
